name: Test package

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [ "main", "tester/*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-package:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    env:
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
    - uses: actions/checkout@v4
    - name: Set up uv
      uses: astral-sh/setup-uv@v6
    - name: Lint
      run: make lint
    - name: Check formatting
      run: uv run ruff format --check src examples
    - name: Test package
      run: make test
