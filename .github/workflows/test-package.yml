name: Test package

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [ "main", "tester/*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-package:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]
        # Set iteration order depends on the hash seed, so run under several.
        hash-seed: ["0", "1", "42", "random"]

    env:
      UV_PYTHON: ${{ matrix.python-version }}
      PYTHONHASHSEED: ${{ matrix.hash-seed }}

    steps:
    - uses: actions/checkout@v4
    - name: Set up uv
      uses: astral-sh/setup-uv@v6
    - name: Lint
      run: make lint
    - name: Check formatting
      run: uv run ruff format --check src examples
    - name: Type check
      run: make type-check
    - name: Test package
      run: make test
