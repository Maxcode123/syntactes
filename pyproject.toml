[tool.setuptools.packages.find]
where = ["src"]
include = ["syntactes*"]
exclude = ["syntactes.tests*"]
namespaces = false

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "syntactes"
version = "0.8.0"
authors = [
  { name="Maximos Nikiforakis", email="nikiforos@live.co.uk" }
]
description = "Parser generator"
keywords = ["parser", "generator"]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.13"
dependencies = []
classifiers = [
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Natural Language :: English",
  "License :: OSI Approved :: MIT License",
  "Topic :: Software Development :: Compilers",
]

[project.urls]
Homepage = "https://maxcode123.github.io/syntactes"
Documentation = "https://maxcode123.github.io/syntactes"
Repository = "https://github.com/Maxcode123/syntactes"
Issues = "https://github.com/Maxcode123/syntactes/issues"
Changelog = "https://github.com/Maxcode123/syntactes/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.6.20",
    "mkdocstrings[python]>=0.30.0",
    "ruff>=0.16.10",
    "ty>=0.0.84",
    "unittest-extensions>=0.4.0",
]
